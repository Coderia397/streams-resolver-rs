# Workspace root.
#
# `shared` holds everything both services need — the provider extractors, the
# HTTP clients, the proxy and manifest rewriter, the cache, and the CORS and
# rate-limit policy. `resolver` is the binary that runs on the phone.
#
# The giga backend (streams-backend-rs) depends on `shared` as a git
# dependency, so the 13 extractors and the proxy exist in exactly one place
# rather than being copied between the two services and drifting apart.

[workspace]
resolver = "2"
members  = ["crates/shared", "crates/resolver"]

[workspace.package]
license = "MIT"
repository = "https://github.com/Coderia397/streams-resolver-rs"
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum        = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
# rustls, NOT openssl — openssl cannot link into a static musl binary
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "cookies", "stream"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
regex       = "1"
once_cell   = "1"
futures     = "0.3"
bytes       = "1"
urlencoding = "2"
hmac        = "0.12"
sha2        = "0.10"
aes-gcm     = "0.10"
pbkdf2      = "0.12"
hex         = "0.4"

# Applies to the whole workspace: the phone binary is what these settings are
# tuned for — small, and it only has to build once per deploy.
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
[workspace.dependencies.wasmi]
version = "0.36"
[workspace.dependencies.base64]
version = "0.22"
